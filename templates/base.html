<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F3EC" id="themeColor">
<script>
(function () {
  try {
    var t = localStorage.getItem('hn-theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<title>{{seo_title}}</title>
<meta name="description" content="{{seo_description}}">
{{canonical_tag}}
{{hreflang_tags}}
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{seo_title}}">
<meta property="og:description" content="{{seo_description}}">
<meta property="og:url" content="{{canonical_url}}">
{{og_tags}}
{{json_ld}}
{{ga_tags}}
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
{{feed_link}}
</head>
<body>
<div class="ticker ticker-top" aria-hidden="true">
  <div class="ticker-track"><span>{{t_ticker}}</span><span>{{t_ticker}}</span></div>
</div>
<a class="skip" href="#main">{{t_skip}}</a>
<header class="site-header">
  <div class="container bar">
    <a class="wordmark" href="{{home_url}}" aria-label="hey.nous — {{t_home}}">hey<span class="dot">.</span>nous</a>
    <nav class="site-nav" id="siteNav" aria-label="{{t_nav_label}}">
      {{nav_links}}
    </nav>
    <div class="header-right">
      {{search_link}}
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="{{t_theme_toggle}}" aria-pressed="false">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M5 19l1.6-1.6M17.4 6.6L19 5"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 13.2A8.2 8.2 0 1 1 10.8 4 6.6 6.6 0 0 0 20 13.2z"/></svg>
      </button>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="siteNav">{{t_menu}}</button>
    </div>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="site-footer">
  <div class="container bar">
    <div>
      <a class="wordmark" href="{{home_url}}" style="font-size:22px">hey<span class="dot">.</span>nous</a>
      <p class="tag">{{t_tagline}}</p>
      <p class="fine" style="margin-top:10px">
        <a href="https://github.com/hey-nous" target="_blank" rel="noopener">GitHub</a> ·
        <a href="https://www.instagram.com/hey.nous" target="_blank" rel="noopener">Instagram</a> ·
        <a href="https://www.threads.com/@hey.nous" target="_blank" rel="noopener">Threads</a> ·
        <a href="https://www.tiktok.com/@hey_nous" target="_blank" rel="noopener">TikTok</a> ·
        <a href="https://x.com/hey_nous" target="_blank" rel="noopener">X</a> ·
        <a href="/{{lang}}/feed.xml" type="application/rss+xml">RSS</a>
      </p>
    </div>
    <div style="text-align:right">
      <span class="locale-switch" role="group" aria-label="Language / Bahasa">
        {{locale_switch}}
      </span>
      <p class="fine">© 2026 hey.nous<br>{{t_footer_note}}</p>
    </div>
  </div>
</footer>
<script>
(function () {
  var btn = document.getElementById('menuBtn');
  var nav = document.getElementById('siteNav');
  if (btn && nav) btn.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  var tt = document.getElementById('themeToggle');
  var meta = document.getElementById('themeColor');
  function sync(dark) {
    if (tt) tt.setAttribute('aria-pressed', dark ? 'true' : 'false');
    if (meta) meta.setAttribute('content', dark ? '#0D1220' : '#F7F3EC');
  }
  sync(document.documentElement.getAttribute('data-theme') === 'dark');
  if (tt) tt.addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem('hn-theme', dark ? 'dark' : 'light'); } catch (e) {}
    sync(dark);
  });
})();
</script>
</body>
</html>

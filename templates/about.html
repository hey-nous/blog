<div class="container">
  <span class="chip enter" style="margin-top:48px;--d:0s">{{t_about_chip}}</span>
  <h1 class="enter" style="font-size:64px;font-weight:800;letter-spacing:-0.025em;margin:20px 0 16px;line-height:1.05;--d:0.1s">{{title}}</h1>
  <p class="enter" style="font-size:21px;color:var(--muted);max-width:62ch;--d:0.2s">{{lede}}</p>

  <div class="about-grid">
    <figure class="nous-panel enter" style="--d:0.3s">
      <span class="orb orb-1" aria-hidden="true"></span>
      <span class="orb orb-2" aria-hidden="true"></span>
      <span class="orb orb-3" aria-hidden="true"></span>
      <img class="nous-float" src="/assets/nous-master.jpg" alt="{{t_nous_alt}}" width="560" height="560">
      <figcaption>{{t_nous_about_caption}}</figcaption>
    </figure>
    <div class="panel-navy reveal" style="grid-template-columns:1fr;--d:0.15s">
      <div>
        <h2 style="font-size:34px">{{t_what_h}}</h2>
        <div style="margin-top:16px">{{body_html}}</div>
        <h3 style="font-size:22px;margin:28px 0 12px">{{t_audience_h}}</h3>
        <div class="topics">{{audience_chips}}</div>
      </div>
    </div>
  </div>

  <h2 class="h2 reveal">{{t_principles_h}}</h2>
  <div class="principles reveal" style="--d:0.1s">
    {{principle_cards}}
  </div>

  <div class="panel-navy reveal" style="grid-template-columns:1fr;margin-bottom:64px">
    <div>
      <h2 style="font-size:34px">{{t_how_h}}</h2>
      <div class="steps">{{steps_html}}</div>
      <p>{{t_how_p}}</p>
    </div>
  </div>

  <h2 class="h2 reveal">{{t_follow_h}}</h2>
  <div class="social-row reveal" style="--d:0.1s">
    <a class="btn btn-primary" href="https://www.instagram.com/hey.nous" target="_blank" rel="noopener">Instagram ↗</a>
    <a class="btn btn-outline" href="https://www.threads.com/@hey.nous" target="_blank" rel="noopener">Threads ↗</a>
    <a class="btn btn-outline" href="https://www.tiktok.com/@hey_nous" target="_blank" rel="noopener">TikTok ↗</a>
    <a class="btn btn-outline" href="https://x.com/hey_nous" target="_blank" rel="noopener">X ↗</a>
  </div>

  <div class="panel-navy closing reveal" style="grid-template-columns:1fr;margin-top:64px">
    <div>
      <h2>{{t_closing_h}}</h2>
      <p style="margin:0 auto">{{t_closing_p}}</p>
    </div>
  </div>
</div>
<script>
(function () {
  var els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window) || !els.length) {
    els.forEach(function (el) { el.classList.add('visible'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.12 });
  els.forEach(function (el) { io.observe(el); });
})();
</script>

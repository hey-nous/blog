<div class="reading-progress" aria-hidden="true"><span id="readingProgress"></span></div>
<article>
  <div class="article-head">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="{{home_url}}">{{t_home}}</a> &nbsp;/&nbsp; {{section_label}}
    </nav>
    <div class="card-chips">{{format_chip}}{{sample_chip}}</div>
    <h1>{{title}}</h1>
    <p class="dek">{{dek}}</p>
    <p class="byline">{{date_line}} &nbsp;•&nbsp; {{reading_line}}</p>
    {{hero_block}}
  </div>
  <div class="prose">
    {{takeaways_block}}
    {{body_html}}
    {{sources_block}}
  </div>
  {{share_block}}
  <div class="related">
    <h2 class="h2">{{t_related}}</h2>
    <div class="card-grid">
      {{related_cards}}
    </div>
  </div>
  <section class="comments" aria-label="{{t_comments}}">
    <h2 class="h2">{{t_comments}}</h2>
    <div id="giscus-container"></div>
  </section>
</article>
<script>
(function () {
  var c = document.getElementById('giscus-container');
  if (!c) return;
  var s = document.createElement('script');
  s.src = 'https://giscus.app/client.js';
  s.async = true;
  s.crossOrigin = 'anonymous';
  s.setAttribute('data-repo', 'hey-nous/blog');
  s.setAttribute('data-repo-id', 'R_kgDOTDK0Dw');
  s.setAttribute('data-category', 'General');
  s.setAttribute('data-category-id', 'DIC_kwDOTDK0D84DJVU7');
  s.setAttribute('data-mapping', 'pathname');
  s.setAttribute('data-strict', '0');
  s.setAttribute('data-reactions-enabled', '1');
  s.setAttribute('data-emit-metadata', '0');
  s.setAttribute('data-input-position', 'top');
  s.setAttribute('data-lang', document.documentElement.lang || 'en');
  s.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  c.appendChild(s);
})();
</script>
<script>
(function () {
  var bar = document.getElementById('readingProgress');
  if (!bar) return;
  var ticking = false;
  function update() {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, (h.scrollTop || document.body.scrollTop) / max)) : 0;
    bar.style.transform = 'scaleX(' + p + ')';
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>

<div class="container">
  <span class="chip" style="margin-top:48px">{{t_karya_chip}}</span>
  <h1 style="font-size:64px;font-weight:800;letter-spacing:-0.025em;margin:20px 0 16px;line-height:1.05">{{title}}</h1>
  <p style="font-size:21px;color:var(--muted);max-width:62ch">{{lede}}</p>
  <div style="font-size:18px;max-width:68ch;margin:24px 0 8px">{{body_html}}</div>

  <div class="card-grid" style="margin-top:32px">
    {{tool_cards}}

  <div class="panel-navy closing" style="grid-template-columns:1fr;margin:64px 0">

      <h2>{{t_karya_closing_h}}</h2>
